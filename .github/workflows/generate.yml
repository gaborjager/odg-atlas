name: Generate ODG maps

on:
  # Check every night at 03:00 UTC
  schedule:
    - cron: "0 3 * * *"

  # A static map or the generator changed
  push:
    branches: [main]
    paths:
      - "static/**"
      - "scripts/generate_odg.py"

  # Manual run from the Actions tab
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even if the source has not changed"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      only:
        description: "Maps to generate (empty = all)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "regions"
          - "departements"
          - "cantons"
          - "communes"
          - "eu-countries"
          - "world-continents"
          - "world-countries"
          - "world-continents,world-countries"
          - "regions,departements"
          - "regions,departements,cantons"

# One run at a time: two runs must not commit the catalog at the same time
concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    name: Generate the ODG files
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Python
        run: python --version

      - name: Generate the ODG files
        id: generate
        env:
          FORCE_REGENERATE: ${{ github.event.inputs.force || 'false' }}
          # Base of the download URLs written in output/maps.json
          ODG_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: |
          ONLY="${{ github.event.inputs.only }}"
          if [ -n "$ONLY" ]; then
            python scripts/generate_odg.py --only "$ONLY"
          else
            python scripts/generate_odg.py
          fi

      - name: Commit the generated files
        if: steps.generate.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ cache/
          git commit -m "chore: regenerate the ODG maps

          Updated files: ${{ steps.generate.outputs.changed_files }}
          Trigger: ${{ github.event_name }}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push

      - name: Upload the ODG files as workflow artifacts
        if: steps.generate.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: odg-maps
          path: |
            output/*.odg
            output/maps.json
          retention-days: 90

      - name: Summary
        run: |
          if [ "${{ steps.generate.outputs.changed }}" = "true" ]; then
            echo "### ✅ ODG maps updated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Regenerated files: \`${{ steps.generate.outputs.changed_files }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            for f in output/*.odg static/*.odg; do
              [ -f "$f" ] || continue
              size=$(du -sh "$f" | cut -f1)
              echo "| \`$f\` | $size |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "### ℹ️ No change detected" >> $GITHUB_STEP_SUMMARY
            echo "The GeoJSON sources and the static maps have not changed." >> $GITHUB_STEP_SUMMARY
          fi
